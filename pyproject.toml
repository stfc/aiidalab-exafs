[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiidalab-exafs"
version = "0.1.0a1"
description = "AiiDAlab app for FEFF-based EXAFS and MD-EXAFS calculations"
authors = [{name = "J. Kane Shenton", email = "kane.shenton@stfc.ac.uk"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["aiida", "feff", "exafs", "xas", "md-exafs", "aiidalab"]
requires-python = ">=3.10"
dependencies = [
    "aiida-core>=2.3,<3",
    "aiida-feff>=0.1.0a1",
    "aiidalab",
    "aiidalab-widgets-base",
    "alc-aiidalab-widgets>=0.1.0",
    "ipywidgets>=8",
    "ipympl>=0.9",
    "traitlets>=5",
    "matplotlib>=3.6",
    "numpy>=1.21",
    "pandas>=2.0",
    "ase>=3.22",
    "weas-widget>=0.1.26",
    "altair>=5.0",
    "md-exafs>=0.3.0,<0.4",
    "marimo>=0.16.4",
    # jupyter-server-proxy 4.x needs jupyter-server 2.x (current AiiDAlab images);
    # 3.2.x still works on the classic Notebook 6 server (older images), where
    # proxy.py applies its websocket workarounds.
    "jupyter-server-proxy>=3.2",
    # Runtime imports of `aiida.restapi.run_api`, which backs the
    # aiida-explorer button via `verdi restapi`. Neither is imported from
    # src/, but dropping either makes `verdi restapi` fail to start with
    # ModuleNotFoundError. flask-cors is needed even though the explorer is
    # served same-origin.
    "flask-restful",
    "flask-cors",
    "ipydatagrid>=1.4.0",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.0",
    "pytest-cov",
]
pre-commit = [
    "pre-commit>=3.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]
dev = [
    "click",
    "toml",
]
docs = [
    "sphinx>=8.0.0",
    "piccolo-theme>=0.14.0",
    "sphinx-toolbox",
    "numpydoc",
]

[project.scripts]
# Deliberately not named `feff8l`: xraylarch installs a console script of that
# name and whichever package is installed last would silently win.
exafs-feff8l = "aiidalab_exafs.codes:feff8l_cli"

[project.entry-points."aiidalab.apps"]
exafs = "aiidalab_exafs:main"
aiidalab_exafs = "aiidalab_exafs:main"

[project.entry-points.jupyter_serverproxy_servers]
exafs-restapi = "aiidalab_exafs.proxy:setup_restapi"
exafs-marimo = "aiidalab_exafs.proxy:setup_marimo"
exafs-explorer = "aiidalab_exafs.proxy:setup_explorer"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".tox",
    ".pytest_cache",
    ".mypy_cache",
    "__pycache__",
    "build",
    "dist",
    "setup.cfg",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "N",
    "D",
    "PL",
]
ignore = [
    "D100",
    "D102",
    "D104",
    "D107",
    "D203",
    "D213",
    "D416",
    "E501",
    "N806",
    "PLC0415",
    "PLR0915",
    "PLR2004",
]

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 24
max-statements = 100

[tool.ruff.lint.per-file-ignores]
"docker/**/*.py" = ["PLR0912", "PLR0915", "D"]
"notebooks/*.py" = ["F841", "B018", "E501", "BLE001", "S110", "D", "N802", "N803", "PLR0912", "PLR0913", "PLR0917", "PLR1711", "PLR5501"]
"tests/**/*.py" = ["D", "N806", "PLC0415", "B017", "E501", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["aiidalab_exafs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "^tests/",
]
show_error_codes = true

[tool.uv]
prerelease = "allow"
