<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a7bd5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a6073;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="15" fill="url(#grad)" />
  <!-- EXAFS spectrum simulation curves -->
  <path d="M 15 75 Q 30 20, 45 60 T 75 40 T 85 50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <!-- Absorbing atom core -->
  <circle cx="30" cy="48" r="7" fill="#ffeb3b" />
  <!-- Outgoing waves/rings -->
  <circle cx="30" cy="48" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />
  <circle cx="30" cy="48" r="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5" />
</svg>
