name: Docker Publish to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'docker/**'
      - 'src/**'
      - 'notebooks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'LICENSE'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'src/**'
      - 'notebooks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'LICENSE'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/stfc/aiidalab-exafs/base
  IMAGE_FULL: ghcr.io/stfc/aiidalab-exafs/full

# linux/amd64 only, and this is not an oversight: xraylarch only bundles
# x86-64 FEFF8L binaries (larch/bin/linux64).
jobs:
  base:
    name: Build base image
    if: github.repository == 'stfc/aiidalab-exafs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push base image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  full:
    name: Build full (exafs + mlip) image
    # Builds FROM the base image pushed above, so it cannot run for pull requests.
    needs: base
    if: github.event_name != 'pull_request' && github.repository == 'stfc/aiidalab-exafs'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      # janus-core[mace] pulls the CUDA torch wheels (nvidia-*, triton), so the
      # image is ~11 GB and the build needs far more than the ~14 GB the runner
      # has free. Remove preinstalled toolchains and images we do not use.
      - name: Check disk space
        run: df -h /

      - name: Free disk space
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true

      - name: Check disk space after cleanup
        run: df -h /

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_FULL }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push full image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/full/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_TAG=${{ env.IMAGE_BASE }}@${{ needs.base.outputs.digest }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
