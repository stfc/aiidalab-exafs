name: ci-testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    name: Clean Install Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install and verify package imports cleanly
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import aiidalab_exafs; print('Imported aiidalab_exafs successfully version:', aiidalab_exafs.__version__)"

  style-check:
    name: Style & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check code formatting and linting
        run: |
          uvx ruff check .
          uvx ruff format --check .

  pytest:
    name: Pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [smoke-test, style-check]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_aiida
          POSTGRES_USER: aiida
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.11
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra testing

      - name: Run test suite with coverage (3.12)
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=aiidalab_exafs --cov-report xml:coverage.xml

      - name: Run test suite (3.10, 3.11)
        if: matrix.python-version != '3.12'
        run: uv run pytest

      - name: Report coverage to Coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: coverage.xml
          base-path: src
